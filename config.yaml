# Aether VR 配置
# API Key 通过 GEMINI_API_KEY 环境变量设置，不要写入此文件

# ── 感知采集 ──────────────────────────────────
capture:
  enabled: true
  video_fps: 1.0          # 1 秒 1 张，永不停止
  jpeg_quality: 70
  max_width: 1024
  monitor: 1              # 1 = 主显示器
  input_sample_rate: 16000
  chunk_ms: 100           # 100ms PCM 块，永不停止
  vad_rms_threshold: 0.02 # 归一化 PCM16 RMS 语音活动阈值
  vad_hangover_s: 0.4     # 语音尾音保持秒数（防断句闪烁）

# ── 小脑：ER2 运动编排 ────────────────────────
cerebellum:
  model: "gemini-robotics-er-2-streaming-preview"
  response_modalities: ["TEXT"]
  compression_trigger_tokens: 120000
  compression_target_tokens: 80000
  max_plan_steps: 6
  max_plan_seconds: 5.0

# ── 大脑：人格与观察（阶段 2）────────────────
brain:
  enabled: true
  model: "gemini-3.5-flash-lite"
  persona_path: "docs/personas/aether-default.yaml"
  interval_s: 60  # 2 小时约 120 次观察，为 Scribe evaluator 保留每日额度
  initial_delay_s: 1.0            # 启动后首轮热观察延迟
  min_event_interval_s: 15.0      # 用户新发言触发提前观察的最小冷却间隔
  max_output_tokens: 512
  context_limit_tokens: 500000
  evict_target_tokens: 350000     # 驱逐滞回，避免频繁触发

# ── 书记官：长期记忆（阶段 2）────────────────
scribe:
  enabled: true
  batch_size: 10                  # 积攒 N 块再批量标记重要性
  db_path: "data/memory.sqlite3"
  context_limit_tokens: 120000
  evict_target_tokens: 80000

# ── 语音 ──────────────────────────────────────
speech:
  model: "gemini-3.1-flash-tts-preview"
  voice_name: "Kore"
  max_segment_chars: 30
  output_sample_rate: 24000
  output_device: "MIXLINE"        # 扬声器 (MIXLINE) → MIXLINE Stream 虚拟麦 → VRChat
  fallback_sound: "assets/filler.wav"
  synthesis_allowance_s: 10.0     # 云端 TTS 合成额外墙钟宽限

# ── DART 动作生成（WSL2）──────────────────────
dart:
  host: "127.0.0.1"
  port: 8900
  timeout_s: 60.0

# ── 动作生成器装配与预算 ───────────────────────
motion:
  mode: "external"                # external = 固定 HTTP DART；supervised = 受管 sidecar bundle
  bundle_manifest: ""
  bundle_dir: ""
  allow_unreleased_bundle: false
  generation_timeout_s: 15.0      # 单次动态生成上限，超时自动回退预录动作
  synthesis_allowance_s: 20.0     # 调度器针对动态动作的额外 I/O 宽限

# ── 姿态桥：DART → SteamVR 六设备 ─────────────
posture:
  enabled: true
  bridge_host: "127.0.0.1"
  bridge_port: 4242               # 与 driver.cpp kPort 一致，改动需同步 C++
  keepalive_fps: 45.0             # 必须快于驱动 1 秒失联阈值
  blend_s: 0.3                    # 段间与来源切换插值
  idle_pose: "stand naturally*1"

# ── VRChat OSC ────────────────────────────────
osc:
  host: "127.0.0.1"
  port: 9000
  parameter_prefix: "/avatar/parameters"
  input_prefix: "/input"

# ── 预录动作与表情 ────────────────────────────
# 注意：OSC Avatar Parameters 只能传 int/float/bool，
#       骨骼级控制必须走 posture 的 SteamVR 路径
avatar:
  action_parameter: "ActionID"
  expression_parameter: "Expression"
  actions:
    idle: 0
    wave: 1
    nod: 2
    shake_head: 3
    bow: 4
    clap: 5
    point: 6
    think: 7
    sit: 8
    stand: 9
  action_durations:
    wave: 1.8
    nod: 1.0
    shake_head: 1.2
    bow: 2.0
    clap: 1.5
    point: 1.2
    think: 2.5
    sit: 2.0
    stand: 2.0
  full_body_actions: ["bow", "sit", "stand"]
  motion_fallback_actions:
    full_body: bow
    upper_body: wave
  expressions:
    neutral: 0
    smile: 1
    surprised: 2
    sad: 3
    angry: 4

# ── 移动 ──────────────────────────────────────
locomotion:
  max_duration_s: 3.0
  watchdog_s: 5.0                 # 硬保险：超时强制归零
  pulse_s: 0.4                    # 走-看-走 脉冲

# ── 高频视觉伺服（auto 优先 OpenCV CPU，不可用时安全降级） ──
vision:
  enabled: true
  detector: "auto"
  detect_fps: 4.0             # 独立于 Brain/ER2 的 1 FPS 视频推送
  fresh_frame_timeout_s: 1.0
  near_ratio: 0.25
  confidence_min: 0.6
  center_tolerance: 0.12
  pulse_s: 0.4
  timeout_s: 30.0
  max_steps: 30
  stagnation_steps: 4

# ── 日志 ──────────────────────────────────────
log:
  level: "INFO"
  file: "logs/aether.log"
  max_bytes: 10000000
  backup_count: 7
