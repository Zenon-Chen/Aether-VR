[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-motion-provider"
version = "0.1.0"
description = "Standalone, provider-neutral motion generation service"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["uvicorn>=0.30,<1", "fastapi>=0.110,<1"]
dart = ["torch>=2.2", "numpy>=1.26", "fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<9"]

[tool.setuptools]
include-package-data = true

[project.scripts]
motion-provider = "motion_provider.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
